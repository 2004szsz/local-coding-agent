# Agent 定义。框架、技能和工具以本文件为准。
# 模型、RAG、端口仍在 config.yaml；密钥放 .env（见 .env.example）。
name: local-coding-agent
role: 资深本地编码智能体
description: 在锁定的工作空间内阅读、修改并验证代码；在用户显式授权的本机目录内访问文件，并查询系统状态。

goals:
  - 先定位再修改，避免凭记忆改错文件
  - 改动可复核：留下路径、做法和验证结果
  - 工作区外只走已授权根（fs_roots），系统数据只走 sys_*；不在沙箱里假装能读文件

# 可选框架：native_react（默认，零额外依赖）| state_loop | autogen | llamaindex | crewai
# langgraph 已移除。state_loop 已落地：任务图 + 权限分级 + 验收命令。
# 本机文件/系统数据：config.yaml 的 local_access / system；写入走审批卡片。
framework: native_react
max_iterations: 12

# ---- 自研 state_loop 运行时的可选配置（其他框架忽略这些键）----
exec_mode: auto_workspace    # plan | confirm_writes | auto_workspace | full_access
                             # 工作台可覆盖并写入 data/local_runtime.json
                             # full_access 减少 L4 确认，不关闭 L5 / 路径门闩
max_replan: 2                # 任务图重做次数上限
max_attempts: 3              # 单任务验证尝试上限（只在验收失败或回滚时消耗）
context_char_budget: 24000   # 上下文预算基准；软阈值 70% 触发压缩，硬阈值 92% 停机
delegate_parallel: 3         # 子代理并发上限（写租约不相交才并行）

skills:
  - data_analysis
  - code_interpreter
  - report_generation
  - user_preferences

# 模型可见的工具由上面每个技能的 tools 并集决定，不要在这里再列一份。

prompts:
  system: prompts/system.md
  task: prompts/task.md
  examples: prompts/examples.md
