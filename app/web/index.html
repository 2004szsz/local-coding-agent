<div id="app" class="app">

  <!-- ================================================================ -->
  <!-- 视图一：工作区                                                    -->
  <!-- ================================================================ -->
  <section id="view-workspace" class="view active">

    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sb-brand">
        <div class="brand-logo">C</div>
        <div class="brand-meta">
          <span class="brand-name">Craftbase</span>
          <span class="brand-tag">智能体工作台</span>
        </div>
      </div>

      <!-- 三链路协同状态：文件系统 → RAG → Agent 循环 -->
      <div class="chain-strip" id="chain-strip" aria-label="系统链路状态">
        <button type="button" class="chain-node" data-chain="fs" id="chain-fs">
          <span class="chain-dot"></span>
          <span class="chain-label" data-i18n="chain.fs">文件</span>
          <span class="chain-val" id="chain-fs-val">—</span>
        </button>
        <span class="chain-link" aria-hidden="true"></span>
        <button type="button" class="chain-node" data-chain="rag" id="chain-rag">
          <span class="chain-dot"></span>
          <span class="chain-label" data-i18n="chain.rag">知识库</span>
          <span class="chain-val" id="chain-rag-val">—</span>
        </button>
        <span class="chain-link" aria-hidden="true"></span>
        <button type="button" class="chain-node" data-chain="agent" id="chain-agent">
          <span class="chain-dot"></span>
          <span class="chain-label" data-i18n="chain.agent">循环</span>
          <span class="chain-val" id="chain-agent-val">—</span>
        </button>
      </div>

      <nav class="sb-menu">
        <button class="sb-menu-item active" id="btn-new-task">
          <svg class="ic"><use href="#i-plus"/></svg><span data-i18n="nav.newTask">新建任务</span><kbd>Ctrl+N</kbd>
        </button>
        <button class="sb-menu-item" id="btn-quick-search">
          <svg class="ic"><use href="#i-search"/></svg><span data-i18n="nav.search">搜索</span><kbd>Ctrl+K</kbd>
        </button>
        <button class="sb-menu-item" id="btn-rag-panel">
          <svg class="ic"><use href="#i-brain"/></svg><span data-i18n="nav.knowledge">知识库</span>
        </button>
        <button class="sb-menu-item" id="btn-open-settings">
          <svg class="ic"><use href="#i-wrench"/></svg><span data-i18n="nav.skills">技能与连接器</span>
        </button>
      </nav>

      <div class="sb-switcher">
        <div class="seg-pill">
          <button class="seg-btn" id="seg-groups" type="button"><svg class="ic sm"><use href="#i-hash"/></svg><span data-i18n="nav.groups"># 分组</span></button>
          <button class="seg-btn active" id="seg-projects" type="button"><svg class="ic sm"><use href="#i-folder"/></svg><span data-i18n="nav.projects">项目</span></button>
        </div>
        <div class="sb-switcher-actions">
          <button class="ic-btn sm" id="btn-sidebar-expand" type="button" data-i18n-title="nav.expandSidebar" title="展开侧边栏"><svg class="ic"><use href="#i-expand"/></svg></button>
          <button class="ic-btn sm" id="btn-sidebar-filter" type="button" data-i18n-title="nav.filterTasks" title="筛选任务"><svg class="ic"><use href="#i-sliders"/></svg></button>
          <button class="ic-btn sm" id="btn-sidebar-trash" type="button" data-i18n-title="nav.archivedTasks" title="已归档"><svg class="ic"><use href="#i-trash"/></svg></button>
        </div>
      </div>

      <div class="sb-scroll">
        <div id="sb-panel-projects">
          <div class="sb-group-label" data-i18n="nav.projectsLabel">项目</div>
          <div id="project-list"></div>
          <button class="project-add-btn" id="btn-add-project" type="button">
            <svg class="ic sm"><use href="#i-plus"/></svg><span data-i18n="nav.addProject">添加本机项目</span>
          </button>
          <div class="sb-group-label" data-i18n="nav.tasks">任务</div>
          <div id="task-list"></div>
        </div>
        <div id="sb-panel-groups" hidden>
          <div class="sb-group-label" data-i18n="nav.fileTree">项目文件</div>
          <div id="sidebar-file-tree" class="file-tree"></div>
        </div>
      </div>

      <div class="sb-foot">
        <button class="account-profile sb-account" id="user-card" type="button" data-i18n-title="account.menu" title="账户菜单">
          <span class="account-avatar sm" aria-hidden="true">旅</span>
          <span class="account-meta">
            <span class="account-name" data-i18n="account.name">旅行者6172</span>
            <span class="account-badge" data-i18n="account.pro">Pro</span>
          </span>
        </button>
        <button class="ic-btn sm" id="btn-gear" type="button" data-i18n-title="account.settings" title="设置中心">
          <svg class="ic"><use href="#i-gear"/></svg>
        </button>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="workspace">
      <header class="titlebar">
        <div class="tb-left"></div>
        <div class="tb-right">
          <button class="win-ic" title="帮助"><svg class="ic"><use href="#i-help"/></svg></button>
          <button class="win-ic" title="分屏"><svg class="ic"><use href="#i-layout"/></svg></button>
          <button class="win-ic" id="btn-fullscreen" title="全屏"><svg class="ic"><use href="#i-fullscreen"/></svg></button>
          <span class="tb-gap"></span>
          <button class="win-ic" title="最小化"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <button class="win-ic" id="btn-maximize" title="最大化"><svg class="ic"><rect x="5.5" y="5.5" width="13" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
          <button class="win-ic close" title="关闭"><svg class="ic" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      </header>

      <div class="ws-body">
        <!-- 欢迎态 -->
        <div id="welcome-pane" class="welcome-pane">
          <p class="brand-greeting" data-i18n="brand.tagline">Craftbase，我帮你</p>
          <h1 class="greeting" id="greeting">早上好呀，新的一天开始啦</h1>

          <div class="mode-tabs" id="mode-tabs" role="tablist">
            <button type="button" class="mode-tab active" data-mode="office" role="tab" data-i18n="mode.office">文档办公</button>
            <button type="button" class="mode-tab" data-mode="code" role="tab" data-i18n="mode.code">代码开发</button>
            <button type="button" class="mode-tab" data-mode="design" role="tab" data-i18n="mode.design">设计创意</button>
          </div>

          <div class="composer-wrap">
            <div class="composer-card">
              <textarea id="input-box" rows="1" spellcheck="false"
                data-i18n-placeholder="composer.placeholder"
                placeholder="今天帮你做些什么？@ 引用文件与对话，/ 调用技能与指令"></textarea>
              <div class="composer-bar">
                <button class="cb-btn" id="btn-attach" type="button" data-i18n-title="composer.attachTitle" title="选择本机项目文件夹"><svg class="ic sm"><use href="#i-plus"/></svg></button>
                <button class="cb-btn role-pick" id="btn-agent-role" type="button">
                  <span class="role-avatar" aria-hidden="true">A</span>
                  <span id="agent-role-label" data-i18n="composer.role">全栈工程师</span>
                  <svg class="ic xs"><use href="#i-chevron-down"/></svg>
                </button>
                <span class="cb-spacer"></span>
                <button class="cb-btn" id="btn-model-pick" type="button">grok/grok-4.6<svg class="ic xs"><use href="#i-chevron-down"/></svg></button>
                <button class="cb-btn think-pick" id="btn-thinking-pick" type="button" title="思考强度">
                  <span class="think-dot" id="think-dot"></span>
                  <span id="think-label">中</span>
                </button>
                <button class="cb-btn exec-pick" id="btn-exec-mode" type="button" title="执行档">
                  <svg class="ic sm"><use href="#i-shield" id="exec-mode-icon"/></svg>
                  <span id="exec-mode-label" data-i18n="exec.auto">自动编辑</span>
                  <svg class="ic xs"><use href="#i-chevron-down"/></svg>
                </button>
                <button id="btn-send" class="send-btn" data-i18n-title="composer.send" title="发送"><svg class="ic"><use href="#i-arrow-up"/></svg></button>
